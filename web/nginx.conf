# WangOJ 前端静态资源 + /api 反向代理
#
# 使用方式：
#   1) docker compose 中使用（容器内 upstream 为 backend:8123）
#   2) 宿主机直接使用（把 upstream 改成 127.0.0.1:8123，并按需启用下方 HTTPS 配置）
#
# 说明：本文件被复制为容器内 /etc/nginx/conf.d/default.conf，
#      因此必须是一个 server 级别的片段（不能包含 http {} 块）。
#      唯一允许的 http 级指令 upstream / limit_req_zone 也写在这里，
#      放在 conf.d 下会被 nginx 主配置 include 到 http 块中，是合法的。

upstream wangoj_backend {
    server backend:8123;
    keepalive 32;
}

# 简单的限流：同一 IP 每秒最多 20 个请求，应对刷接口
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    # 如需强制 HTTPS，取消下面注释（并先申请证书）
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # 先用 Report-Only 观察，避免误伤 Markdown 渲染器的内联样式；确认无告警后可改为强制 CSP
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ---------- 健康检查 ----------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------- 上传/大请求限制 ----------
    client_max_body_size 1m;

    # ---------- 后端 API ----------
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://wangoj_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # AI 接口可能较慢
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 判题沙箱接口绝不允许从外部访问（即使误配端口也在这里兜底）
    location = /api/v1/judge {
        return 404;
    }

    # ---------- 静态资源缓存 ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- SPA 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 隐藏文件 ----------
    location ~ /\. {
        deny all;
    }
}

# ---------- HTTPS 示例（按需启用） ----------
